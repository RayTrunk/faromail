name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Match tag and application version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          CONFIG_VERSION="$(python3 -c "import json; print(json.load(open('neutralino.config.json'))['version'])")"
          test "$TAG_VERSION" = "$FILE_VERSION"
          test "$TAG_VERSION" = "$CONFIG_VERSION"
          chmod +x security_check.sh
          ./security_check.sh
          python3 tools/check_version.py

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build portable Windows package
        shell: pwsh
        run: |
          & .\build_windows.ps1 -FreshNpm
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            throw 'Inno Setup (ISCC.exe) not found on this runner.'
          }
          & $iscc packaging\windows\faromail.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect Windows files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-windows -Force | Out-Null
          Copy-Item build\windows\*.zip release-windows\ -ErrorAction SilentlyContinue
          Copy-Item build\windows\*.exe release-windows\ -ErrorAction SilentlyContinue
          Copy-Item build\windows\*.sha256 release-windows\ -ErrorAction SilentlyContinue

          if (-not (Get-ChildItem release-windows -File)) {
            throw 'No Windows package generated.'
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-windows/*
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release existante détectée : $GITHUB_REF_NAME"

            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FARO Mail ${GITHUB_REF_NAME#v}" \
              --notes-file .github/release-notes.md

            gh release upload "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "FARO Mail ${GITHUB_REF_NAME#v}" \
              --notes-file .github/release-notes.md \
              --verify-tag
          fi
