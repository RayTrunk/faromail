name: Build portable packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify sources
        shell: pwsh
        run: |
          python tools/check_version.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $required = @(
            'build_windows.ps1',
            'packaging/windows/snapshot-db.js',
            'packaging/windows/README_WINDOWS.txt.in'
          )

          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required Windows packaging file is missing: $file"
            }
          }

      - name: Build portable Windows package
        shell: pwsh
        run: |
          & .\build_windows.ps1 -FreshNpm
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            throw 'Inno Setup (ISCC.exe) not found on this runner.'
          }
          & $iscc packaging\windows\faromail.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect Windows files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-windows -Force | Out-Null
          Copy-Item build\windows\*.zip release-windows\ -ErrorAction SilentlyContinue
          Copy-Item build\windows\*.exe release-windows\ -ErrorAction SilentlyContinue
          Copy-Item build\windows\*.sha256 release-windows\ -ErrorAction SilentlyContinue

          if (-not (Get-ChildItem release-windows -File)) {
            throw 'No Windows package generated.'
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: faromail-windows-x86_64
          path: release-windows/*
          if-no-files-found: error
          retention-days: 14
