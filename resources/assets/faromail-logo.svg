<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="skyGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EDF5FD"/>
      <stop offset="100%" stop-color="#D0E4F7"/>
    </radialGradient>

    <!-- Beacon Warm Light Gradient -->
    <radialGradient id="beaconLight" cx="50%" cy="26%" r="42%">
      <stop offset="0%" stop-color="#FFF5CC" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFE885" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D0E4F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Lamp Core Glow -->
    <radialGradient id="lampBulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFDD55"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </radialGradient>

    <!-- Envelope Crisp White/Silver Gradient -->
    <linearGradient id="mailBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF3FA"/>
    </linearGradient>

    <!-- Envelope Flap Gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBE7F5"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0A2540" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="40" fill="#F4F8FC"/>

  <!-- Light Rays -->
  <g opacity="0.85">
    <polygon points="400,200 130,100 170,330" fill="url(#beaconLight)"/>
    <polygon points="400,200 670,100 630,330" fill="url(#beaconLight)"/>
  </g>

  <!-- Circular Badge -->
  <circle cx="400" cy="290" r="180" fill="url(#skyGlow)" stroke="#0E3059" stroke-width="10" filter="url(#softShadow)"/>
  <circle cx="400" cy="290" r="165" fill="none" stroke="#2575FC" stroke-width="3" stroke-opacity="0.35"/>

  <!-- LIGHTHOUSE -->
  <!-- Base Platform -->
  <path d="M305 410 L495 410 L515 432 L285 432 Z" fill="#0E3059"/>
  <rect x="270" y="432" width="260" height="12" rx="6" fill="#091E36"/>

  <!-- Main Tower -->
  <path d="M344 215 L456 215 L478 410 L322 410 Z" fill="#FFFFFF" stroke="#0E3059" stroke-width="8" stroke-linejoin="round"/>

  <!-- Stripes -->
  <path d="M350 252 L450 252 L456 298 L344 298 Z" fill="#1C68D4"/>
  <path d="M332 355 L468 355 L474 398 L326 398 Z" fill="#1C68D4"/>

  <!-- Doorway -->
  <path d="M384 410 L384 385 Q400 372 416 385 L416 410 Z" fill="#0E3059"/>

  <!-- Balcony -->
  <rect x="332" y="206" width="136" height="11" rx="4" fill="#0E3059"/>
  <line x1="348" y1="198" x2="348" y2="206" stroke="#0E3059" stroke-width="3.5"/>
  <line x1="370" y1="198" x2="370" y2="206" stroke="#0E3059" stroke-width="3.5"/>
  <line x1="400" y1="198" x2="400" y2="206" stroke="#0E3059" stroke-width="3.5"/>
  <line x1="430" y1="198" x2="430" y2="206" stroke="#0E3059" stroke-width="3.5"/>
  <line x1="452" y1="198" x2="452" y2="206" stroke="#0E3059" stroke-width="3.5"/>
  <line x1="340" y1="198" x2="460" y2="198" stroke="#0E3059" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Lantern Room -->
  <rect x="352" y="160" width="96" height="40" fill="#FFE885" stroke="#0E3059" stroke-width="7"/>
  <circle cx="400" cy="180" r="15" fill="url(#lampBulb)"/>
  <line x1="376" y1="160" x2="376" y2="200" stroke="#0E3059" stroke-width="4"/>
  <line x1="400" y1="160" x2="400" y2="200" stroke="#0E3059" stroke-width="4"/>
  <line x1="424" y1="160" x2="424" y2="200" stroke="#0E3059" stroke-width="4"/>

  <!-- Dome -->
  <path d="M346 160 C346 108 454 108 454 160 Z" fill="#0E3059"/>
  <circle cx="400" cy="110" r="7" fill="#0E3059"/>
  <line x1="400" y1="110" x2="400" y2="85" stroke="#0E3059" stroke-width="5" stroke-linecap="round"/>

  <!-- MAIL ENVELOPE (Front) -->
  <g filter="url(#softShadow)">
    <rect x="305" y="285" width="190" height="122" rx="14" fill="url(#mailBodyGrad)" stroke="#0E3059" stroke-width="7"/>
    <!-- Fold Lines -->
    <path d="M308 402 L382 340 L400 351 L418 340 L492 402" fill="none" stroke="#B0C8E4" stroke-width="5" stroke-linejoin="round"/>
    <path d="M308 402 L382 340 L400 351 L418 340 L492 402" fill="none" stroke="#0E3059" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Flap -->
    <path d="M308 290 L389 353 Q400 361 411 353 L492 290" fill="url(#flapGrad)" stroke="#0E3059" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Seal -->
    <circle cx="400" cy="354" r="13" fill="#1C68D4" stroke="#0E3059" stroke-width="3"/>
    <polygon points="400,345 405,359 395,359" fill="#FFE885"/>
  </g>

  <!-- VECTOR PATH TYPOGRAPHY: "FARO" -->
  <g fill="#0E3059">
    <!-- F -->
    <path d="M228 540 H284 V556 H248 V580 H280 V596 H248 V630 H228 Z"/>
    <!-- A -->
    <path d="M344 540 H366 L396 630 H374 L367 608 H333 L326 630 H304 Z M350 560 L338 594 H362 Z"/>
    <!-- R -->
    <path d="M428 540 H462 Q484 540 484 562 Q484 577 470 584 L488 630 H464 L448 588 H448 V630 H428 Z M448 554 V574 H460 Q466 574 466 564 Q466 554 460 554 Z"/>
    <!-- O -->
    <path d="M528 538 Q558 538 558 585 Q558 632 528 632 Q498 632 498 585 Q498 538 528 538 Z M528 554 Q516 554 516 585 Q516 616 528 616 Q540 616 540 585 Q540 554 528 554 Z"/>
  </g>

  <!-- Divider Line -->
  <line x1="330" y1="655" x2="470" y2="655" stroke="#1C68D4" stroke-width="4" stroke-linecap="round"/>

  <!-- VECTOR PATH TYPOGRAPHY: "MAIL" -->
  <g fill="#1C68D4">
    <!-- M -->
    <path d="M272 680 H288 L304 712 L320 680 H336 V730 H322 V701 L309 726 H299 L286 701 V730 H272 Z"/>
    <!-- A -->
    <path d="M374 680 H388 L408 730 H393 L389 718 H373 L369 730 H354 Z M381 694 L375 709 H387 Z"/>
    <!-- I -->
    <path d="M434 680 H448 V730 H434 Z"/>
    <!-- L -->
    <path d="M478 680 H492 V717 H518 V730 H478 Z"/>
  </g>
</svg>
