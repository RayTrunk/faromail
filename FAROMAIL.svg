<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Ozeanblauer Farbverlauf für das Kuvert -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="50%" stop-color="#4364F7"/>
      <stop offset="100%" stop-color="#6FB1FC"/>
    </linearGradient>
    
    <!-- Warmer Orange-Verlauf für den Leuchtturm (Faro) -->
    <linearGradient id="orangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#F09819"/>
    </linearGradient>
    
    <!-- Lichtkegel (Glow) -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <g transform="translate(0, -20)">
    <!-- Basis des Kuverts -->
    <path d="M64 160 C64 142.3 78.3 128 96 128 L416 128 C433.7 128 448 142.3 448 160 L448 352 C448 369.7 433.7 384 416 384 L96 384 C78.3 384 64 369.7 64 352 L64 160 Z" fill="url(#blueGrad)"/>

    <!-- Schattierungen für die Umschlag-Optik -->
    <path d="M64 160 L256 288 L448 160 L448 352 C448 369.7 433.7 384 416 384 L96 384 C78.3 384 64 369.7 64 352 Z" fill="#000000" fill-opacity="0.15"/>
    <path d="M64 352 L256 224 L448 352 L416 384 L96 384 Z" fill="#ffffff" fill-opacity="0.2"/>

    <!-- Die obere Briefklappe als Lichtkegel -->
    <path d="M64 128 L256 288 L448 128 Z" fill="url(#glow)"/>

    <!-- Leuchtturm (Faro) im Zentrum -->
    <!-- Turm -->
    <path d="M236 288 L276 288 L266 160 L246 160 Z" fill="url(#orangeGrad)"/>
    <!-- Laternenraum -->
    <rect x="240" y="140" width="32" height="20" rx="4" fill="#1E293B"/>
    <!-- Leuchtfeuer (Fenster) -->
    <rect x="248" y="144" width="16" height="12" fill="#FDE047"/>
    <!-- Dach -->
    <path d="M236 140 L276 140 L256 115 Z" fill="#1E293B"/>
  </g>

  <!-- Modernes Lettering -->
  <text x="256" y="470" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="42" fill="#1E293B" text-anchor="middle" letter-spacing="4">FARO MAIL</text>
</svg>
